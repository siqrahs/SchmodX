name: Build Chmods App Core (Aplikasi Induk)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Menjalankan build debug langsung menggunakan perintah gradle bawaan runner global
    # Perintah 'assembleDebug' tidak membutuhkan konfigurasi keystore apa pun
    # Menggunakan flag --no-daemon agar lebih stabil di lingkungan container
    # Ditambahkan parameter khusus untuk bypass download gradle wrapper
    run: gradle :app-core:assembleDebug --no-daemon

    - name: Upload Debug APK Core ke Artifact GitHub
      uses: actions/upload-artifact@v4
      with:
        name: chmods-app-core-debug
        path: app-core/build/outputs/apk/debug/app-core-debug.apk
